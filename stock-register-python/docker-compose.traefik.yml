# GodownBook (Python) on a server that ALREADY runs Traefik on ports 80/443 (e.g. Hostinger's Docker VPS image).
# Traefik routes https://godown.ajmalaji.tech to this container and gets the Let's Encrypt certificate itself
# (resolver "letsencrypt", entrypoint "websecure"). No Caddy here.
#
#   docker compose -f docker-compose.traefik.yml up -d --build
services:
  app:
    build: .
    image: godownbook-py:latest
    container_name: godownbook-py-app
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: file:/data/godownbook.db
      APP_URL: https://${DOMAIN:-godown.ajmalaji.tech}
    volumes:
      - db-data:/data
    expose:
      - "8000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.godownpy.rule=Host(`${DOMAIN:-godown.ajmalaji.tech}`)
      - traefik.http.routers.godownpy.entrypoints=websecure
      - traefik.http.routers.godownpy.tls.certresolver=letsencrypt
      - traefik.http.routers.godownpy.middlewares=godownpy-headers
      - traefik.http.routers.godownpy.service=godownpy
      - traefik.http.services.godownpy.loadbalancer.server.port=8000
      - traefik.http.middlewares.godownpy-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.godownpy-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.godownpy-headers.headers.customFrameOptionsValue=SAMEORIGIN
      - traefik.http.middlewares.godownpy-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      # Strip any country header a visitor sends so PPP pricing can't be spoofed.
      - traefik.http.middlewares.godownpy-headers.headers.customrequestheaders.X-Vercel-IPCountry=

volumes:
  db-data: # the SQLite database: back this up

