# GodownBook: the part every environment shares (the app container and its database volume).
# Add ONE environment file on top of this one:
#   live (Traefik):  docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d --build
#   this computer:   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   own HTTPS (Caddy): docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
# (or set COMPOSE_FILE=docker-compose.yml:docker-compose.traefik.yml in a .env file and just run `docker compose up -d --build`)
services:
  app:
    build: .
    image: godownbook-py:latest
    container_name: godownbook-py-app
    restart: unless-stopped
    # env_file (secrets) is set by each environment file, never here.
    environment:
      APP_ENV: production
      DATABASE_URL: file:/data/godownbook.db
      APP_URL: https://${DOMAIN:-godown.ajmalaji.tech}
    volumes:
      - db-data:/data
    expose:
      - "8000"

volumes:
  db-data: # the SQLite database: back this up
