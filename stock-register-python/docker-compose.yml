# GodownBook (Python): app + Caddy (HTTPS) for https://godown.ajmalaji.tech
#   1. cp .env.production.example .env.production   (fill it in)
#   2. docker compose up -d --build
services:
  app:
    build: .
    image: godownbook-py:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: file:/data/godownbook.db
      APP_URL: https://${DOMAIN:-godown.ajmalaji.tech}
    volumes:
      - db-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-godown.ajmalaji.tech}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data: # the SQLite database: back this up
  caddy-data: # HTTPS certificates
  caddy-config:
