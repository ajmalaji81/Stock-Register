# THIS COMPUTER: http://localhost:8080 (no domain, no HTTPS). Uses ./.env (copy .env.example) for secrets.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Data lives in the "godownbook-demo-data" volume (created on first start; load demo data into it if you want it).
services:
  app:
    image: godownbook-py:local
    container_name: godownbook-demo
    env_file: .env
    environment:
      APP_URL: http://localhost:8080
    ports:
      - "8080:8000"

volumes:
  db-data:
    name: godownbook-demo-data
