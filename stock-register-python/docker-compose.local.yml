# GodownBook on this computer (no domain / HTTPS): docker compose -f docker-compose.local.yml up -d
# Opens at http://localhost:8080. Uses the existing "godownbook-demo-data" volume (created with the demo data).
services:
  app:
    image: godownbook-py:demo
    build: .
    container_name: godownbook-demo
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: file:/data/godownbook.db
      APP_URL: http://localhost:8080
    ports:
      - "8080:8000"
    volumes:
      - godownbook-demo-data:/data

volumes:
  godownbook-demo-data:
    external: true
