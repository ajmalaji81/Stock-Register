{% macro fields(p=None) %}
<div class="row">
  <label>Name<input name="name" required value="{{ p.name if p }}"></label>
  <label>Type<select name="type">{% for t in ['CUSTOMER','SUPPLIER','BOTH'] %}<option {{ 'selected' if p and p.type == t }}>{{ t }}</option>{% endfor %}</select></label>
  <label>Phone<input name="phone" value="{{ p.phone if p }}"></label>
  <label>Email<input name="email" value="{{ p.email if p }}"></label>
</div>
<div class="row">
  <label>GSTIN<input name="gstin" value="{{ p.gstin if p }}"></label>
  <label>State<select name="state"><option value=""></option>{% for s in states %}<option {{ 'selected' if p and p.state == s }}>{{ s }}</option>{% endfor %}</select></label>
  <label>Address<input name="address" value="{{ p.address if p }}"></label>
  <label>Opening balance (+ they owe us, - we owe)<input name="openingBalance" type="number" step="0.01" value="{{ p.openingBalance if p else 0 }}"></label>
</div>
{% endmacro %}
{% macro pay_form(party_id, modes, today) %}
<form method="post" action="/app/payments" class="row">
  <input type="hidden" name="partyId" value="{{ party_id }}">
  <label>Direction<select name="direction"><option value="IN">Received from party</option><option value="OUT">Paid to party</option></select></label>
  <label>Amount<input name="amount" type="number" step="0.01" min="0.01" required></label>
  <label>Mode<select name="mode">{% for m in modes %}<option>{{ m }}</option>{% endfor %}</select></label>
  <label>Date<input name="date" type="date" value="{{ today }}"></label>
  <label>Reference<input name="reference"></label>
  <button class="btn">Record payment</button>
</form>
{% endmacro %}
