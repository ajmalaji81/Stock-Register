{% extends "base.html" %}
{% block title %}Log in — GodownBook{% endblock %}
{% from "_logo.html" import logo %}
{% block public %}
<div class="auth-wrap"><div class="auth-card card pop-in">
  {{ logo("/", 38) }}
  <h1>Log in</h1>
  {% if error %}<div class="flash err" style="margin:0 0 10px">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label>Email<input type="email" name="email" value="{{ email }}" required autofocus></label>
    <label>Password<input type="password" name="password" required></label>
    <button class="btn" type="submit" style="width:100%;margin-top:6px">Log in</button>
  </form>
  <p class="muted"><a href="/forgot-password">Forgot password?</a></p>
  <p class="muted">New here? <a href="/signup">Create an account</a></p>
</div></div>
{% endblock %}
